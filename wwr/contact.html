<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Adventures White Water Rafting</title>
    <meta name="description"
      content="Contact Rapid Adventures to ask questions, plan your white water rafting trip, or send us feedback.">
    <meta name="author" content="EFRAIN LEON">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rapid Adventures Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Información de la Empresa -->
        <section class="company-info">
            <h1>Rapid Adventures White Water Rafting</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Bloque central: Mapa + Formulario -->
        <section class="contact-container">
            <!-- Mapa interactivo de Google Maps -->
            <div class="map-wrapper">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808580858085%3A0x0!2zMzfCsDQ2Jz2OSyAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"
                  loading="lazy">
                </iframe>
            </div>

            <!-- Formulario de Contacto -->
            <form action="#" method="post" class="quiz-form">
                <div class="form-item">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="user_name"
                      placeholder="Enter your full name" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="user_email"
                      placeholder="Enter your email address" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <label for="inquiry">
                        <input type="radio" id="inquiry" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="usermessage">Message</label>
                    <textarea id="usermessage" name="user_message" rows="5"
                      placeholder="Type here..." required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Sección de Empleados / Equipo -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/client.jpg" alt="Rapid Adventures Guide Manager">
                    <figcaption>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/hero.jpg" alt="Safety Specialist">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/salmon_river_hero.jpg" alt="Logistics Manager">
                    <figcaption>Expedition Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Rapid Adventures | Efraín Steven León Jiménez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
